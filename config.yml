# ============================================================
#  Aegis SMP - config.yml
#  Effects are written  "effect_id:LEVEL:SECONDS"  (LEVEL is the roman-numeral level, 1 = I).
#  Permanent effects are written "effect_id:LEVEL".
#  Chances are percentages (10 = 10%).
#  Passives are listed IN UNLOCK ORDER inside ClassType.java; with 6 passives the 1st unlocks
#  at 0 energy and the last at 5 energy (5 passives: 0,1,3,4,5).
# ============================================================

# ============================================================
#  ABILITY KEYS (under classes.<class>.a1 / a2). Damage is in HP: 2.0 = 1 heart.
#   cooldown        seconds           damage / min-damage / max-damage
#   seconds         effect duration   radius / range / distance / speed
#   armor-damage    durability removed from every armor piece of each target the ability damages
#   armor-repair    durability healed on every armor piece you wear when you cast it
#   effects         ["effect_id:LEVEL:SECONDS"]
#  Every number an ability uses lives here - open the class block and edit it.
# ============================================================

general:
  starting-energy: 2
  max-energy: 5
  duration-bonus-per-energy: 0.02   # +2% ability duration per energy
  all-damage-true: true             # EVERY hit (melee, arrows, explosions, abilities...) ignores armor. Resistance effects and absorption hearts still work
  true-damage-ignores-enchants: true  # with all-damage-true: protection-type enchantments (Protection, Blast Prot...) are ignored too
  abilities-ignore-armor: true      # only used when all-damage-true is false: then ONLY ability damage ignores armor
  strong-hit-threshold: 0.9         # attack-cooldown needed for passives to proc (blocks weak-hit procs)
  assign-class-on-first-join: true  # first join plays the slot-machine roll
  default-command-mode: false       # false = F / Shift+F, true = /ability 1 /ability 2

energy:
  loss-on-death: 1          # energy never drops below 0
  gain-on-kill: 0

trust:
  mutual-required: false   # true = both players must /trust each other
  disable-pvp: false       # true = trusted players cannot melee each other at all

stun:
  allowed-items: [GOLDEN_APPLE, ENCHANTED_GOLDEN_APPLE, POTION, SPLASH_POTION, LINGERING_POTION]

bleed:
  damage-per-second: 1.0   # half a heart per second

particles:
  enabled: true
  intensity: 1.0     # 0.5 = half the particles, 2.0 = double (lower it if players lag)
  ambient: true      # themed aura around every player, denser with more energy

hud:
  mode: glyph              # glyph = needs the resource pack (icon with bar underneath); text = plain fallback
  update-ticks: 4

gear:
  scan-ticks: 10           # how often netherite/diamond swapping is checked

items:
  use-item-model: true     # needs the resource pack (makes the heads look like your orb art)
  energy:
    name: "Energy Marble"
    texture: ""            # optional base64 skin texture value (minecraft-heads.com style)
  reroll:
    name: "Class Reroller"
    texture: ""

# Optional crafting recipes (shaped). Ingredient letters map to materials. Off by default.
recipes:
  energy:      # Energy Marble
    enabled: false
    amount: 1
    shape: ["DND", "NEN", "DND"]
    ingredients: {D: DIAMOND_BLOCK, N: NETHERITE_INGOT, E: NETHER_STAR}
  reroll:      # Class Reroller
    enabled: false
    amount: 1
    shape: ["EGE", "GNG", "EGE"]
    ingredients: {E: EMERALD_BLOCK, G: GOLD_BLOCK, N: NETHER_STAR}

# ============================================================
#  CUSTOM ENCHANTS - only obtainable from enchanting tables, max-per-item per piece of gear.
#  Admins (aegis.admin / op) can apply them with /enchant [player] <id> [level], /cenchant or /aegis enchant -
#  these ignore max-per-item. /enchant falls back to the vanilla command for non-custom enchants.
#  Per-enchant keys: enabled, name, max-level, plus the numbers listed.
# ============================================================
custom-enchants:
  max-per-item: 2
  table:
    base-chance: 10            # % chance of a custom enchant = base + chance-per-level * (enchanting level cost)
    chance-per-level: 2.0
    max-chance: 85
    second-roll-multiplier: 0.4   # the 2nd custom enchant uses this x the chance
  bleed: {enabled: true, name: "Bleed", max-level: 3, chance-per-level: 3, seconds: 5}
  reel: {enabled: true, name: "Reel", max-level: 3, pull-per-level: 1.0}
  might: {enabled: true, name: "Might", max-level: 5, per-level: 0.25}          # same scaling as Power: +25% x (level+1)
  tri_shot: {enabled: true, name: "Tri Shot", max-level: 1, angle: 10}
  grapple: {enabled: true, name: "Grapple", max-level: 1, strength: 3.0, cooldown: 30}
  timber: {enabled: true, name: "Timber", max-level: 1, max-blocks: 256}
  vein_miner: {enabled: true, name: "Vein Miner", max-level: 1, max-blocks: 64, require-sneak: false}
  executioner: {enabled: true, name: "Executioner", max-level: 3, chance-per-level: 10}
  soulbound: {enabled: true, name: "Soulbound", max-level: 1}
  lifeleach: {enabled: true, name: "Lifeleach", max-level: 5, percent-per-level: 0.10}
  excavation: {enabled: true, name: "Excavation", max-level: 4}                 # 1 = 1x2, 2 = plus, 3 = 3x3, 4 = 5x5. Shift+right-click to toggle
  ember: {enabled: true, name: "Ember", max-level: 1, fire-ticks: 1200}
  charge: {enabled: true, name: "Charge", max-level: 3, blocks-per-level: 5, speed: 1.5, hunger-cost: 10, cooldown: 30, damage-base: 8, damage-per-level: 4}
  penetration: {enabled: true, name: "Penetration", max-level: 4, percent-per-level: 0.10}
  heavy_blow: {enabled: true, name: "Heavy Blow", max-level: 1, chance: 3, stun-seconds: 1.5}
  indomitable: {enabled: true, name: "Indomitable", max-level: 1, reduction: 0.05}
  unmovable: {enabled: true, name: "Unmovable", max-level: 1, per-piece: 0.10}
  immortal: {enabled: true, name: "Immortal", max-level: 1, durability-cost: 150, cooldown: 1800, revive-health: 1.0}
  double_attack: {enabled: true, name: "Double Attack", max-level: 1, chance: 1, multiplier: 2.0}
  reshuffle: {enabled: true, name: "Reshuffle", max-level: 1, chance: 0.25}

classes:
  # ---------------------------------------------------------------- SHACKLED
  shackled:
    a1: {armor-damage: 0, armor-repair: 0, cooldown: 30, range: 30, seconds: 10}
    a2: {armor-damage: 0, armor-repair: 0, cooldown: 20, range: 30, damage: 4.0, bleed-seconds: 5, pull-strength: 3.0, self-pull-strength: 3.5}
    passives:
      kb: {knockback-resistance: 0.5}
      slow: {when: hit, chance: 10, action: effect, effect: slowness, level: 3, seconds: 10}
      bleed: {when: hit, chance: 5, action: bleed, seconds: 5}
      shuffle: {when: hit, chance: 1, action: shuffle}
      enchain: {when: hit, chance: 2, action: enchain, seconds: 2}

  # ---------------------------------------------------------------- MOANDER
  moander:
    a1:
      armor-damage: 0
      armor-repair: 0
      cooldown: 60
      effects: ["regeneration:3:30", "resistance:2:30", "absorption:5:120"]
    a2:
      armor-damage: 0
      armor-repair: 0
      cooldown: 45
      range: 30
      steal-hp: 4.0          # 2 hearts taken from the target
      my-hearts: 12          # your heart count while active
      seconds: 20
      effects: ["wither:2:10"]
    passives:
      wither: {when: hit, chance: 10, action: effect, effect: wither, level: 2, seconds: 3}
      poison: {when: hit, chance: 10, action: effect, effect: poison, level: 3, seconds: 3}
      immune: {immune-effects: [wither, poison, weakness]}
      rotten:
        foods: [ROTTEN_FLESH]
        remove-hunger: true
        extra-saturation: 8.8          # brings rotten flesh up to golden-apple saturation
        effects: ["regeneration:2:5", "absorption:1:120"]
      armor: {armor-damage-multiplier: 1.25}
      skeleton: {ignored-by: [WITHER_SKELETON]}

  # ---------------------------------------------------------------- CHRONO
  chrono:
    a1: {armor-damage: 0, armor-repair: 0, cooldown: 60, radius: 10, seconds: 2.5}
    a2:                      # Future Sight: dodge the next hits
      armor-damage: 0
      armor-repair: 0
      cooldown: 45
      dodges: 5
      seconds: 30            # how long the dodges last (0 = until used up)
      dodge-causes: [ENTITY_ATTACK, ENTITY_SWEEP_ATTACK, PROJECTILE]
    passives:
      eat: {eat-time-multiplier: 0.8}
      armor: {armor-damage-multiplier: 1.25}
      haste: {permanent-effects: ["haste:2"]}
      buffs: {buff-duration-multiplier: 1.5}      # every timed buff you receive lasts 50% longer
      wither: {when: hit, chance: 10, action: effect, effect: wither, level: 2, seconds: 3}
      regen: {permanent-effects: ["regeneration:1"]}

  # ---------------------------------------------------------------- ICOR
  icor:
    a1: {armor-damage: 0, armor-repair: 0, cooldown: 30, range: 30, damage: 2.0, borrow-seconds: 300, projectile-speed: 1.6, hit-radius: 1.0}
    a2: {armor-damage: 0, armor-repair: 0, cooldown: 60, range: 30, steal-hp: 4.0, my-hearts: 15, seconds: 30}
    passives:
      heal: {heal-on-hit: 1.0}
      bleed: {when: hit, chance: 5, action: bleed, seconds: 5}
      strength: {permanent-effects: ["strength:1"]}
      cap: {max-damage: 8.0}
      regen: {permanent-effects: ["regeneration:1"]}
      immune: {immune-effects: [wither]}

  # ---------------------------------------------------------------- BERSERKER
  berserker:
    a1:
      armor-damage: 0
      armor-repair: 0
      cooldown: 60
      seconds: 20
      effects: ["strength:2:20", "speed:2:20"]
      after-effects: ["weakness:1:20", "slowness:1:20"]
      after-hearts: 8
      after-seconds: 20
    a2: {armor-damage: 0, armor-repair: 0, cooldown: 30, damage: 2.0, swings: 3, radius: 3.5, interval-ticks: 4}
    passives:
      neth: {netherite-upgrade: [AXE]}
      shield: {shield-disable-multiplier: 2.0}
      strength: {permanent-effects: ["strength:1"]}
      stun: {when: hit, chance: 5, action: stun, seconds: 1.5, crit-only: true, axe-only: true}
      haste: {permanent-effects: ["haste:1"]}
      timber: {timber: true, require-axe: true, max-blocks: 256}

  # ---------------------------------------------------------------- DOLUS
  dolus:
    a1: {armor-damage: 0, armor-repair: 0, cooldown: 20, range: 30, damage: 6.0, stun-seconds: 1, projectile-speed: 1.5, hit-radius: 1.0}
    passives:
      resist: {permanent-effects: ["resistance:1"]}
      gapple: {foods: [GOLDEN_APPLE, ENCHANTED_GOLDEN_APPLE], refund-chance: 20}
      kb: {knockback-resistance: 0.5}
      ores:
        ores:
          emerald: {materials: [EMERALD_ORE, DEEPSLATE_EMERALD_ORE], cooldown: 0, effects: ["hero_of_the_village:5:3600"]}
          lapis: {materials: [LAPIS_ORE, DEEPSLATE_LAPIS_ORE], cooldown: 120, enchant-boost: 1, seconds: 30}
          diamond: {materials: [DIAMOND_ORE, DEEPSLATE_DIAMOND_ORE], cooldown: 120, effects: ["strength:2:5", "speed:2:5"]}
          iron: {materials: [IRON_ORE, DEEPSLATE_IRON_ORE], cooldown: 180, effects: ["resistance:2:30"]}
      glow: {glow-radius: 50}
      fortune: {fortune-multiplier: 2}

  # ---------------------------------------------------------------- SAMURAI
  samurai:
    a1: {armor-damage: 0, armor-repair: 0, cooldown: 30, seconds: 10, damage-multiplier: 1.25, sword: NETHERITE_SWORD}
    a2: {armor-damage: 0, armor-repair: 0, cooldown: 20, range: 20, bonus-damage: 3.0, behind-distance: 1.5, window-seconds: 10}
    passives:
      neth: {netherite-upgrade: [SWORD]}
      combo: {combo-start: 3, combo-every: 2, combo-multiplier: 1.5, combo-window-seconds: 3}
      strength: {permanent-effects: ["strength:1"]}
      bleed: {when: hit, chance: 5, action: bleed, seconds: 5}
      speed: {permanent-effects: ["speed:1"]}
      nofall: {no-fall-damage: true}

  # ---------------------------------------------------------------- YMIR
  ymir:
    a1: {armor-damage: 0, armor-repair: 0, cooldown: 120, range: 20, radius: 25, max-seconds: 0}   # max-seconds 0 = until death / re-press
    a2: {armor-damage: 0, armor-repair: 0, cooldown: 60, seconds: 5}
    passives:
      resist: {permanent-effects: ["resistance:1"]}
      shield: {no-shield-durability: true}
      slow: {when: damaged, chance: 5, action: effect, effect: slowness, level: 2, seconds: 10}
      thorns: {thorns: 1.0}
      stun: {shield-stun-multiplier: 0.5}
      resist2: {shield-stun-effects: ["resistance:2"]}

  # ---------------------------------------------------------------- VARUNA
  varuna:
    a1: {armor-damage: 0, armor-repair: 0, cooldown: 30, radius: 15, damage: 4.0, pull: 2.5}
    a2: {armor-damage: 0, armor-repair: 0, cooldown: 40, range: 25, seconds: 5, damage-per-second: 1.0}
    passives:
      regen: {when: water_or_rain, effects: ["regeneration:2"]}
      crit: {crit-in-water: 1.5}
      grace: {permanent-effects: ["dolphins_grace:1", "conduit_power:1"]}
      trident: {trident-attack-damage: 10, trident-attack-speed: 1.6}
      kelp: {foods: [DRIED_KELP], extra-food: 5, extra-saturation: 13.8}   # = golden carrot (6 food / 14.4 sat)
      riptide: {trident-riptide: 3}

  # ---------------------------------------------------------------- AGNI
  agni:
    a1: {armor-damage: 0, armor-repair: 0, cooldown: 60, radius: 20, seconds: 20, replace-solid-blocks: false, blocks-per-tick: 20000}
    a2:                      # Fireball: damage is in HP (2.0 = 1 heart). 14.0 = 7 hearts at full charge, ignores armor
      armor-damage: 0
      armor-repair: 0
      cooldown: 90
      min-damage: 2.0
      max-damage: 14.0
      max-seconds: 60        # time to reach full charge
      decay-seconds: 8       # how fast it loses power after full charge
      range: 60
      projectile-speed: 1.2
      hit-radius: 1.2
      explosion-power-min: 1.5   # block-breaking explosion size at 0% charge (TNT = 4)
      explosion-power-max: 6.0   # ... and at 100% charge
      blast-radius: 5            # who gets splash damage
      splash-damage-multiplier: 0.6
      break-blocks: true
      set-fire: true
      self-damage: false
      burn-seconds: 5
    passives:
      ignite: {when: hit, chance: 15, action: ignite, seconds: 5}
      fireres: {permanent-effects: ["fire_resistance:1"]}
      lavaregen: {when: lava, effects: ["regeneration:2"]}
      lavares: {when: lava, effects: ["resistance:2"]}
      swim: {lava-swim: true}
      dmg: {burning-multiplier: 1.1}

  # ---------------------------------------------------------------- HEPHAESTUS
  hephaestus:
    a1: {armor-damage: 0, armor-repair: 0, cooldown: 45, radius: 10, damage: 4.0, armor-drain: 25}
    a2: {armor-damage: 0, armor-repair: 0, cooldown: 30, range: 30, damage: 2.0, stun-seconds: 2, item: NETHERITE_AXE, projectile-speed: 1.6, hit-radius: 1.0}
    passives:
      neth: {netherite-upgrade: [ARMOR]}
      gapple: {foods: [GOLDEN_APPLE, ENCHANTED_GOLDEN_APPLE], absorption-multiplier: 2, extra-saturation: 9.6}
      armor_less: {armor-durability-multiplier: 0.9}
      resist: {permanent-effects: ["resistance:1"]}
      armor_dmg: {armor-damage-multiplier: 1.25}
      smelt: {autosmelt: true, autosmelt-ores-only: true, debris-multiplier: 2}   # ores-only false = smelt every drop

  # ---------------------------------------------------------------- BOREUS
  boreus:
    a1: {armor-damage: 0, armor-repair: 0, cooldown: 30, distance: 30, speed: 2.0}
    a2: {armor-damage: 0, armor-repair: 0, cooldown: 180, seconds: 20, mace-cooldown-after: 120, windburst-level: 1, windburst-velocity: 1.3, overdrive-min-fall: 1.5}   # during Overdrive: no cap, no cooldown, normal mace rules
    passives:
      mace: {mace-min-fall: 5, mace-cooldown: 10, mace-flat-damage: 10.0, mace-max-damage: 8.0, mace-density: 2}   # flat-damage = every smash does exactly this much (10 = 5 hearts, also during Overdrive). 0 = old fall-scaled density-II formula (capped by max-damage)
      wind: {wind-charge-straight: true, wind-charge-multiplier: 1.5}
      refund: {wind-charge-refund: 50}
      sculk: {sculk-silent: true}
      nofall: {no-fall-damage: true, fall-damage-on: [POINTED_DRIPSTONE]}
      speed: {permanent-effects: ["speed:2"]}

  # ---------------------------------------------------------------- AZAROTH
  azaroth:
    a1:                      # Deep's Call: pet Warden, lasts until it dies, then cooldown-after-death
      armor-damage: 0
      armor-repair: 0
      cooldown-after-death: 180
      health-multiplier: 0.5     # pet has half a Warden's health
      damage-multiplier: 0.25    # and deals a quarter of its damage
      follow-teleport-distance: 20
    a2:                      # Warden's Domain: an Ancient City rises around an inactive portal
      armor-damage: 0
      armor-repair: 0
      cooldown: 120
      seconds: 60
      radius: 30                 # size of the domain (doubled)
      center-offset: 5           # the portal is built this many blocks in front of you
      portal-inner-width: 3      # reinforced-deepslate portal frame (inner size, the frame adds 2)
      portal-inner-height: 5
      building-density: 1.0      # 0 = no buildings, 2 = very crowded
      ruin-amount: 1.0           # 0 = pristine city, 2 = mostly rubble
      effects: ["darkness:1:6"]
      beam-interval-ticks: 40    # warden beams (doubled: half as often)
      beams-per-interval: 3
      beam-damage: 6.0           # HP (3 hearts), ignores armor
      beam-range: 45
      aim-at-enemies-chance: 0.5
      blocks-per-tick: 1500      # lower = less lag while the city is built
      restore: true              # false = the city stays forever
      vein-chance: 0.35          # sculk decoration on the ground
      sensor-chance: 0.03
      calibrated-chance: 0.015
      shrieker-chance: 0.01      # decorative only - never summons a Warden
      catalyst-chance: 0.015     # extra catalysts are added near the portal
      protected-materials: [BEDROCK, REINFORCED_DEEPSLATE, END_PORTAL_FRAME]
      dome: true                 # obsidian dome sealing the domain (removed with the city)
      dome-material: OBSIDIAN
      dome-thickness: 2
      dome-gap: 1                # blocks between the domain radius and the dome's inside
      dome-depth: 10             # how far below ground level the dome reaches (solid terrain is left alone)
    passives:
      wardens: {ignored-by: [WARDEN]}
      darkness: {when: hit, chance: 5, action: effect, effect: darkness, level: 1, seconds: 10}
      resist: {permanent-effects: ["resistance:1"]}
      strength: {permanent-effects: ["strength:1"]}
      sculk:
        when: sculk
        effects: ["resistance:2", "regeneration:2"]
        sculk-blocks: [SCULK, SCULK_CATALYST, SCULK_SHRIEKER, SCULK_SENSOR, CALIBRATED_SCULK_SENSOR, SCULK_VEIN]

  # ---------------------------------------------------------------- MIDAS
  midas:
    a1:                      # Golden Touch: duplicates the item in your hand (never shulker boxes, bundles, Energy Marbles or Rerollers)
      armor-damage: 0
      armor-repair: 0
      cooldown: 1800         # 30 minutes
      copies: 1
      whole-stack: true      # false = copies a single item
      blocked-materials: []
    a2:                      # Bounty: mob drops multiplied
      armor-damage: 0
      armor-repair: 0
      cooldown: 600
      seconds: 120
      multiplier: 20
      max-stacks-per-kill: 256
    passives:
      neth: {netherite-upgrade: [PICKAXE, SHOVEL, HOE]}
      haste: {permanent-effects: ["haste:2"]}
      hero: {permanent-effects: ["hero_of_the_village:10"]}
      mining: {autosmelt: true, autosmelt-ores-only: true, ore-multiplier: 3, debris-multiplier: 3}
      nethergold: {nether-gold-ingot-amount: 1}
      heads: {head-chance: 5, textures: {}}      # textures: {COW: "<base64 texture>"} for custom mob heads

  # ---------------------------------------------------------------- ROGUE
  rogue:
    a1:                      # Stealth: true invisibility (hidden from everyone, armor and held items too) + speed; ends early when you are hit
      armor-damage: 0
      armor-repair: 0
      cooldown: 45
      seconds: 10
      speed-level: 3
    a2:                      # Shadow Step: teleport along your look direction; a silent decoy runs the opposite way (no particles)
      armor-damage: 0
      armor-repair: 0
      cooldown: 20
      range: 30
      decoy-seconds: 4
      decoy-speed: 0.3       # blocks per tick (0.3 = sprinting pace)
    passives:
      backstab: {backstab-chance: 20, backstab-multiplier: 2.0, backstab-cone: 120}   # cone = degrees behind the target that count as a backstab
      shuffle: {when: hit, chance: 1, action: shuffle}
      speed: {permanent-effects: ["speed:2"]}
      invis: {permanent-effects: ["invisibility:1"]}
      tp: {tp-behind-chance: 5}
      poison: {when: hit, chance: 5, action: effect, effect: poison, level: 3, seconds: 3}

  # ---------------------------------------------------------------- YGGDRASIL
  yggdrasil:
    a1:                      # Vitality Boost
      armor-damage: 0
      armor-repair: 0
      cooldown: 60
      seconds: 20
      health-multiplier: 2.0     # doubles your max hearts
      instant-heal: 20           # HP healed instantly (20 = 10 hearts)
      penalty-seconds: 10        # afterwards golden apples are weakened for this long
      penalty-saturation: 4.8    # saturation a golden apple gives during the penalty (half of vanilla); they also only give Regeneration I
    a2:                      # World Tree Root
      armor-damage: 0
      armor-repair: 0
      cooldown: 30
      range: 30
      damage: 4.0                # HP (2 hearts)
      freeze-seconds: 4
    passives:
      regen: {permanent-effects: ["regeneration:1"]}
      gap: {foods: [GOLDEN_APPLE, ENCHANTED_GOLDEN_APPLE], extra-saturation: 9.6}   # +9.6 on top of vanilla's 9.6 = double
      day: {when: day, effects: ["regeneration:2"]}
      pots: {instant-heal-level: 3}                                               # every healing potion heals like Instant Health III
      hit: {heal-on-hit: 1.0}                                                      # half a heart per hit
      kills: {kill-hp: 2.0, kill-max-hp: 4.0, players-only: true}                  # +1 heart per kill, up to 2 extra hearts (lost on death)

  # ---------------------------------------------------------------- JACKPOT
  jackpot:
    a1:                      # Luck of the Draw: one of four outcomes (25% each)
      armor-damage: 0
      armor-repair: 0
      cooldown: 45
      hits: 5                # outcome 1 = next hits do x2, outcome 2 = next hits do x0.5
      seconds: 10            # outcome 3 = potion levels doubled, outcome 4 = potion effects removed (and blocked) for this long
    a2:                      # High Roller: next hits are 50% double damage / 50% no damage
      armor-damage: 0
      armor-repair: 0
      cooldown: 30
      hits: 5
    passives:
      saver: {keep-chance: 10}                                  # % chance an item is not used up (blocks, food, potions, thrown items)
      speed: {permanent-effects: ["speed:1"]}
      gap: {gap-double-chance: 10, gap-fail-chance: 10}         # golden apple: double absorption + saturation / does nothing
      shuffle: {shuffle-chance: 10, self-shuffle-chance: 5}     # swaps two hotbar items of the victim / of yourself on hit
      risk: {hit-heal-chance: 5, hit-heal-hp: 4, hit-hurt-chance: 5, hit-hurt-hp: 2}   # on hit: heal 2 hearts or take 1 heart (separate rolls)
      roll: {sharp-min: 1, sharp-max: 10}                       # every hit re-rolls the Sharpness of your sword

  # ---------------------------------------------------------------- FATEWEAVER
  fateweaver:
    a1:                      # Weave of Fate: you and your target share damage (armor stands work too)
      armor-damage: 0
      armor-repair: 0
      cooldown: 60
      seconds: 20
      range: 30
      max-distance: 50       # the thread snaps when you get further apart than this
    a2:                      # Web We Weave: destroys every cobweb around you
      armor-damage: 0
      armor-repair: 0
      cooldown: 20
      radius: 5
    passives:
      climb: {climb-speed: 0.22}                                # hold Shift against a wall: look up to climb, look down to slide, level to cling
      weaving: {permanent-effects: ["weaving:1"]}
      venom: {when: hit, chance: 5, action: effect, effect: poison, level: 3, seconds: 3}
      webs: {web-save-chance: 25}                               # % chance a placed cobweb is not used up
      spiders: {ignored-by: [SPIDER, CAVE_SPIDER]}
      fall: {no-fall-damage: true}

  # ---------------------------------------------------------------- SINGULARITY
  singularity:
    a1:                      # Starfall: launch up, slam down, explosion + damage
      armor-damage: 0
      armor-repair: 0
      cooldown: 60
      launch-velocity: 1.9
      slam-speed: 2.6
      radius: 6
      damage: 6.0            # HP (3 hearts)
      explosion-power: 4
      break-blocks: false    # true = the explosion also breaks blocks
    a2:                      # Blackhole: pulls everything in, then implodes
      armor-damage: 0
      armor-repair: 0
      cooldown: 45
      range: 25
      radius: 14             # pull radius
      seconds: 5
      pull: 0.85
      implode-radius: 8
      damage: 4.0            # HP (2 hearts)
    passives:
      pull: {arrow-pull: 1.2}                                   # arrows pull the target towards you
      kb: {knockback-resistance: 0.5}
      resist: {permanent-effects: ["resistance:1"]}
      hunter: {low-hp-bonus: 1.25, hp-threshold: 12}            # +25% damage to targets under 6 hearts
      fall: {no-fall-damage: true}
      void: {void-immune: true}                                 # void damage puts you back on the last ground you stood on

  # ---------------------------------------------------------------- SPARTAN
  spartan:
    a1:                      # Champion's Steed: a tamed, saddled, armored horse with max stats
      armor-damage: 0
      armor-repair: 0
      cooldown: 60
      health: 30
      speed: 0.3375
      jump: 1.0
    a2:                      # Spartan's Charge: lunge that deals true damage, knocks back and disables shields
      armor-damage: 0
      armor-repair: 0
      cooldown: 30
      dash-speed: 1.9
      damage: 3.0            # HP (1.5 hearts)
      knockback: 1.1
      shield-break-seconds: 20
    passives:                # one unlocks per energy: 0E, 1E, 2E, 3E, 4E, 5E
      netherite: {diamond-to-netherite: true}                   # diamond spears in your inventory become netherite
      speed: {permanent-effects: ["speed:1"], permanent-effects-max-energy: ["speed:2"]}
      fall: {no-fall-damage: true, requires-spear: true, fall-damage-on: [POINTED_DRIPSTONE]}
      feather: {feather-dash-cooldown: 30, feather-dash-speed: 1.4}   # right-click a feather to dash
      air: {air-boost: 1.07, max-speed: 0.7}                    # keeps your momentum in the air
      shield: {shield-break-speed: 10, shield-cooldown: 5}      # spear hits above 10 blocks/s break shields for 5s

